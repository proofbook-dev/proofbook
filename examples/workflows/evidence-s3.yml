# Proofbook evidence from s3.
# S3, Cloudflare R2, GCS interop or MinIO. Objects are OTLP JSON/JSONL
# as written by the OTel collector file exporter.
#
# Nightly: archive yesterday's traces while the vendor still has them.
# Monthly: seal last month into a signed evidence bundle (OIDC-bound).
name: proofbook-evidence-s3
on:
  schedule:
    - cron: "17 5 * * *"   # nightly pull
    - cron: "0 6 1 * *"    # monthly seal, first of the month
  workflow_dispatch:

permissions:
  id-token: write   # this line is what signs the bundle
  contents: read

env:
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  S3_PREFIX: ${{ vars.S3_PREFIX }}
  S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
  S3_REGION: ${{ vars.S3_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  pull:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pull yesterday's traces
        run: npx proofbook pull --source s3 --period last-2d --out traces/s3
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: traces-s3-${{ github.run_id }}
          path: traces/s3/
          retention-days: 90

  seal:
    if: github.event.schedule == '0 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Seal last month from s3
        run: npx proofbook seal --source s3 --period last-month --sign oidc
      - name: Chain summary
        run: npx proofbook chain --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: proofbook-evidence-${{ github.run_id }}
          path: .proofbook/store/bundles/
          if-no-files-found: error
      # To feed the hosted chain and auditor portal, add:
      #   env: { PROOFBOOK_TOKEN: ${{ secrets.PROOFBOOK_TOKEN }} }
      #   run: npx proofbook push
