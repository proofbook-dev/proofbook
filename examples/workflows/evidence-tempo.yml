# Proofbook evidence from tempo.
# Grafana Cloud: use the tempo query endpoint with a stack API token.
#
# Nightly: archive yesterday's traces while the vendor still has them.
# Monthly: seal last month into a signed evidence bundle (OIDC-bound).
name: proofbook-evidence-tempo
on:
  schedule:
    - cron: "17 5 * * *"   # nightly pull
    - cron: "0 6 1 * *"    # monthly seal, first of the month
  workflow_dispatch:

permissions:
  id-token: write   # this line is what signs the bundle
  contents: read

env:
  TEMPO_URL: ${{ vars.TEMPO_URL }}
  TEMPO_USER: ${{ vars.TEMPO_USER }}
  TEMPO_TOKEN: ${{ secrets.TEMPO_TOKEN }}

jobs:
  pull:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pull yesterday's traces
        run: npx proofbook pull --source tempo --period last-2d --out traces/tempo
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: traces-tempo-${{ github.run_id }}
          path: traces/tempo/
          retention-days: 90

  seal:
    if: github.event.schedule == '0 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Seal last month from tempo
        run: npx proofbook seal --source tempo --period last-month --sign oidc
      - name: Chain summary
        run: npx proofbook chain --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: proofbook-evidence-${{ github.run_id }}
          path: .proofbook/store/bundles/
          if-no-files-found: error
      # To feed the hosted chain and auditor portal, add:
      #   env: { PROOFBOOK_TOKEN: ${{ secrets.PROOFBOOK_TOKEN }} }
      #   run: npx proofbook push
