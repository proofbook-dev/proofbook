# Generation: the 1.37+ development-status conventions.
#
# gen_ai.system was renamed to gen_ai.provider.name, and message content
# moved into the structured gen_ai.input.messages / gen_ai.output.messages
# attributes (opt-in). Operation names are unchanged. Frameworks emitting
# this generation often still carry the older attributes alongside; the
# conflict resolver prefers this file and records the discrepancy.

generation: otel-genai-latest
precedence: 30
description: >
  OTel GenAI conventions 1.37+: gen_ai.provider.name and structured
  input/output message attributes.

fingerprint:
  signals:
    - { kind: attr_present, key: "gen_ai.provider.name", weight: 0.5 }
    - { kind: attr_present, key: "gen_ai.input.messages", weight: 0.3 }
    - { kind: attr_present, key: "gen_ai.operation.name", weight: 0.2 }

mappings:
  - event: ModelCall
    match:
      attr_present: ["gen_ai.provider.name"]
      attr_in:
        "gen_ai.operation.name":
          [chat, completion, text_completion, generate_content, embeddings]
    fields:
      provider: { attr: "gen_ai.provider.name", required: true }
      model:
        attr_first: ["gen_ai.response.model", "gen_ai.request.model"]
        required: true
      "token_usage.input":
        attr_first: ["gen_ai.usage.input_tokens"]
        expected: true
      "token_usage.output":
        attr_first: ["gen_ai.usage.output_tokens"]
        expected: true
      finish_reason:
        attr: "gen_ai.response.finish_reasons"
        first_element: true
      "request_params.temperature": { attr: "gen_ai.request.temperature" }
      "request_params.max_tokens": { attr: "gen_ai.request.max_tokens" }
    content_refs:
      prompt: { attr: "gen_ai.input.messages" }
      completion: { attr: "gen_ai.output.messages" }

  - event: ToolCall
    match:
      attr_present: ["gen_ai.provider.name"]
      attr_in: { "gen_ai.operation.name": [execute_tool] }
    fields:
      tool_name:
        attr: "gen_ai.tool.name"
        from_span_name: "^execute_tool\\s+(.+)$"
        required: true
      server: { attr: "mcp.server.name" }
    content_refs:
      arguments: { attr: "gen_ai.tool.call.arguments" }
      result: { attr: "gen_ai.tool.call.result" }

  - event: AgentRun
    match:
      attr_present: ["gen_ai.provider.name"]
      attr_in: { "gen_ai.operation.name": [invoke_agent] }
    fields:
      agent_id:
        attr_first: ["gen_ai.agent.id", "gen_ai.agent.name"]
        required: true
      agent_name: { attr: "gen_ai.agent.name" }
      session_id: { attr: "gen_ai.conversation.id" }

  - event: HumanCheckpoint
    shared: true
    match:
      attr_present: ["proofbook.human_checkpoint.type"]
    fields:
      type: { attr: "proofbook.human_checkpoint.type", required: true }
      decision: { attr: "proofbook.human_checkpoint.decision" }
    content_refs:
      actor: { attr: "proofbook.human_checkpoint.actor" }
